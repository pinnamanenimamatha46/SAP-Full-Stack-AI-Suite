name: SAP Finance AI CI

on:
  push:
    branches:
      - main
    paths:
      - "sap-finance-ai-platform/**"
      - ".github/workflows/sap-finance-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "sap-finance-ai-platform/**"
      - ".github/workflows/sap-finance-ci.yml"

  workflow_dispatch:

jobs:
  quality-and-tests:
    name: Quality and Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: sap-finance-ai-platform

    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "sqlite+pysqlite:///./test.db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: |
            sap-finance-ai-platform/uv.lock
            sap-finance-ai-platform/pyproject.toml

      - name: Install Python
        run: uv python install 3.11

      - name: Verify project files
        run: |
          test -f pyproject.toml
          test -f uv.lock
          test -d app
          test -d tests

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -v