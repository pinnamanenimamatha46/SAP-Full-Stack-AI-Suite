[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# PostgreSQL connection used by Alembic
sqlalchemy.url = postgresql+psycopg://sap_finance:sap_finance_password@localhost:5435/sap_finance_ai


[post_write_hooks]
# Optional Ruff formatting hook for generated migrations
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

