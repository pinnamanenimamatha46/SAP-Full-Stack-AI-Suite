[project]
name = "sap-finance-ai-platform"
version = "0.1.0"
description = "Enterprise SAP Finance AI Platform built with FastAPI, SQLAlchemy, PostgreSQL, and AI services."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
